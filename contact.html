<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="styles.css"> <!-- Linking external CSS file -->

</head>
<body>
    <!-- Header Section -->
    <header>
        <h1>Welcome to ICU Library</h1>
        <p>Your gateway to knowledge and information.</p>
    </header>
    
    <!-- Navigation Menu -->
    <nav>
        <ul>
            <li><a href="index.html">Home</a></li>

            <li><a href="#services">Services</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>
    
   
    
    
    
    <!-- Contact Form -->
    <section id="contact">
        <h2>Contact Us</h2>
        <form id="contactForm">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>
            
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
            <label for="message">Message:</label>
            <textarea id="message" name="message" required></textarea>
            <label for="message">ID number:</label>
            <textarea id="ID number" name="message" required></textarea>
            
            <button type="submit">Send</button>
        </form>
    </section>
    
    
    
    <!-- Footer Section -->
    <footer>
        <p>DELIVER IT QUALITY EDUCATION</p>
    </footer>
</body>
